services:
  api:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]
    environment:
      ENV: ${ENV:-development}
      CROSSWALK_API_KEY: ${CROSSWALK_API_KEY:-}
      BANKING_CROSSWALK_TENANT_ID: ${BANKING_CROSSWALK_TENANT_ID:-public-demo}
      BANKING_CROSSWALK_ACTOR: ${BANKING_CROSSWALK_ACTOR:-}
      BANKING_CROSSWALK_ROLE: ${BANKING_CROSSWALK_ROLE:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ALLOW_EPHEMERAL_CROSSWALK: ${ALLOW_EPHEMERAL_CROSSWALK:-false}
      DATABASE_URL: ${DATABASE_URL:-}
    mem_limit: 768m
    cpus: 1.0
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  web:
    build: ./web
    ports: ["127.0.0.1:3000:3000"]
    environment:
      CROSSWALK_API_URL: http://api:8000
      CROSSWALK_API_KEY: ${CROSSWALK_API_KEY:-}
      BANKING_CROSSWALK_TENANT_ID: ${BANKING_CROSSWALK_TENANT_ID:-public-demo}
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
