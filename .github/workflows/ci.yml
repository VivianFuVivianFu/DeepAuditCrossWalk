name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade 'pip>=26.2.2' 'setuptools>=84.1.0'
      - run: python -m pip install -e './backend[dev,postgres]'
      - run: python -m ruff check backend scripts/experiments
      - run: python -m pytest backend/tests -q
      - run: PYTHONPATH=. python -m pytest scripts/experiments -q
      - run: python -m pip_audit --local --skip-editable
      - run: python scripts/check_secrets.py
      - run: python -m build backend
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: test-ci-admin-only
          POSTGRES_DB: crosswalk_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d crosswalk_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:test-ci-admin-only@localhost:5432/crosswalk_test
      TEST_DATABASE_URL: postgresql+psycopg://crosswalk_ci:test-ci-only@localhost:5432/crosswalk_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade 'pip>=26.2.2' 'setuptools>=84.1.0'
      - run: python -m pip install -e './backend[dev,postgres]'
      - run: python scripts/setup_test_postgres.py
      - run: python -m pytest backend/tests/test_repository.py -q
      - run: python scripts/verify_restored_database.py --seed
      - name: Verify a real PostgreSQL backup and restore
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" pg_dump -U postgres -d crosswalk_test -Fc -f /tmp/crosswalk.backup
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres crosswalk_restore
          docker exec "$POSTGRES_CONTAINER" pg_restore -U postgres -d crosswalk_restore /tmp/crosswalk.backup
          python scripts/verify_restored_database.py
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ENV: production
      CROSSWALK_API_KEY: test-container-service-key-at-least-32-bytes
      BANKING_CROSSWALK_TENANT_ID: public-demo
      BANKING_CROSSWALK_ACTOR: ci.synthetic.reviewer
      BANKING_CROSSWALK_ROLE: risk
      POSTGRES_PASSWORD: test-compose-admin-only
      CROSSWALK_DATABASE_PASSWORD: test-compose-runtime-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - run: python scripts/smoke_test.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Scenario A — Playwright against Production Public Demo
        env:
          SMOKE_WEB_URL: http://localhost:3000
          E2E_SCENARIO: public_demo
        run: npx playwright test e2e/scenario_a_public_demo.spec.ts
        working-directory: web
      - name: Start optional PostgreSQL stack
        env:
          BANKING_CROSSWALK_TENANT_ID: ci-persistence-smoke
        run: |
          docker compose down
          docker compose -f compose.yaml -f compose.postgres.yaml up -d --wait --wait-timeout 120
      - name: Persistence smoke test — create & review in PostgreSQL
        env:
          BANKING_CROSSWALK_TENANT_ID: ci-persistence-smoke
        run: python scripts/persistence_smoke_test.py create
      - name: Restart API container to verify PostgreSQL persistence
        env:
          BANKING_CROSSWALK_TENANT_ID: ci-persistence-smoke
        run: docker compose -f compose.yaml -f compose.postgres.yaml restart api
      - name: Persistence smoke test — verify after restart & tenant isolation
        env:
          BANKING_CROSSWALK_TENANT_ID: ci-persistence-smoke
        run: python scripts/persistence_smoke_test.py verify
      - name: Scenario B — Playwright against Authenticated Private Workspace (PostgreSQL)
        env:
          BANKING_CROSSWALK_TENANT_ID: ci-private-workspace
          ALLOW_LOCAL_DEV_AUTH_BYPASS: "false"
        run: |
          SCENARIO_B_SECRET=$(node -e 'console.log(require("node:crypto").randomBytes(32).toString("hex"))')
          SCENARIO_B_PASSWORD="ci-ephemeral-$(node -e 'console.log(require("node:crypto").randomBytes(12).toString("hex"))')"
          SCENARIO_B_USERS_JSON=$(PW="$SCENARIO_B_PASSWORD" node -e '
            const crypto = require("node:crypto");
            const pw = process.env.PW;
            const salt = crypto.randomBytes(16).toString("hex");
            const hash = crypto.scryptSync(pw, salt, 64, { N: 16384, r: 8, p: 1 }).toString("hex");
            console.log(JSON.stringify([{
              user_id: "usr-ci-reviewer",
              username: "ci.reviewer",
              display_name: "CI Verification Reviewer",
              password_hash: `scrypt$${salt}$${hash}`,
              tenants: { "ci-private-workspace": ["reviewer"] }
            }]));
          ')
          WORKSPACE_SESSION_SECRET="$SCENARIO_B_SECRET" WORKSPACE_USERS_JSON="$SCENARIO_B_USERS_JSON" \
            docker compose -f compose.yaml -f compose.postgres.yaml up -d --force-recreate --wait --wait-timeout 120
          (
            cd web
            SMOKE_WEB_URL="http://localhost:3000" \
            E2E_SCENARIO="private_workspace" \
            E2E_USERNAME="ci.reviewer" \
            E2E_PASSWORD="$SCENARIO_B_PASSWORD" \
            E2E_TENANT_ID="ci-private-workspace" \
              npx playwright test e2e/scenario_b_private_workspace.spec.ts
          )
      - if: always()
        run: docker compose -f compose.yaml -f compose.postgres.yaml down -v
