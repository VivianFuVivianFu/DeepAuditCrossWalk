[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deepaudit-crosswalk"
version = "0.1.0"
description = "Traceable AI questionnaire coverage and enterprise policy gap analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Vivian Fu and contributors"}]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "openpyxl>=3.1.5,<4", "defusedxml>=0.7.1,<1",
  "pypdf>=6.21.2,<7", "python-docx>=1.2,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "httpx2>=2.13,<3", "ruff>=0.13,<1", "pip-audit>=2.9,<3", "build>=1.2,<2"]

[tool.setuptools.packages.find]
include = ["banking_crosswalk*"]

[tool.setuptools.package-data]
banking_crosswalk = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
